<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistente Senior</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --gold: #d4af37;
      --gold-soft: #f5e6ad;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --button: #d4af37;
      --button-text: #111827;
      --line: rgba(212, 175, 55, 0.4);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      text-align: center;
      margin-top: 4px;
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      object-fit: cover;
      margin-bottom: 10px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.2rem);
      color: var(--gold-soft);
      font-weight: bold;
      line-height: 1.1;
    }

    .header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .voice-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #1f2937;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      flex-wrap: wrap;
    }

    .voice-selector label {
      color: var(--gold-soft);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .voice-selector select {
      background: #0b1220;
      color: white;
      border: 1px solid var(--gold);
      border-radius: 10px;
      padding: 10px 12px;
      min-width: 210px;
      font-size: 1rem;
    }

    .mic-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 4px;
      margin-bottom: 6px;
    }

    .mic-btn {
      width: 220px;
      height: 220px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, #d4af37, #aa7c11);
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(212,175,55,0.45);
      font-weight: 800;
      font-size: 24px;
    }

    .mic-btn .icon {
      font-size: 54px;
    }

    .chat-box {
      background: #0b1220;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      min-height: 200px;
      max-height: 330px;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .bubble {
      max-width: 90%;
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 1rem;
      word-wrap: break-word;
    }

    .bubble.assistant {
      background: #182333;
      border: 1px solid rgba(212, 175, 55, 0.35);
      align-self: flex-start;
      border-radius: 16px 16px 16px 4px;
    }

    .bubble.user {
      background: linear-gradient(135deg, #d4af37, #aa7c11);
      color: #111827;
      align-self: flex-end;
      border-radius: 16px 16px 4px 16px;
      font-weight: 700;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      border: 1px solid rgba(212,175,55,0.4);
      background: #0b1220;
      color: white;
      border-radius: 14px;
      min-height: 70px;
      max-height: 140px;
      resize: vertical;
      padding: 12px 14px;
      font-size: 1rem;
      outline: none;
    }

    .send-btn {
      width: 60px;
      height: 60px;
      border: none;
      border-radius: 50%;
      background: var(--button);
      color: var(--button-text);
      font-size: 28px;
      font-weight: 900;
      cursor: pointer;
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 2px;
    }

    @media (max-width: 480px) {
      .app {
        padding: 16px;
      }

      .mic-btn {
        width: 180px;
        height: 180px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <img
        class="logo"
        src="https://raw.githubusercontent.com/terapiasol-ai/Aurion/main/aurioncare-logo.jpg"
        alt="Asistente"
      />
      <h1>Asistente Senior</h1>
      <p>Apoyo claro y humano</p>
    </div>

    <div class="voice-selector">
      <label for="voiceSelect">Voz:</label>
      <select id="voiceSelect">
        <option value="femenino">Aoede / Femenina</option>
        <option value="masculino">Algieba / Masculina</option>
      </select>
    </div>

    <div class="mic-wrap">
      <button class="mic-btn" id="micBtn" type="button">
        <span class="icon">🎙️</span>
        <span id="micText">Hablar</span>
      </button>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="bubble assistant">
        Hola, soy tu asistente. Estoy aquí para ayudarte de forma clara, amable y tranquila.
      </div>
    </div>

    <div class="controls">
      <textarea id="userInput" placeholder="Escribe aquí tu mensaje..."></textarea>
      <button class="send-btn" id="sendBtn" type="button">➤</button>
    </div>

    <div class="footer-note">
      Puede hablar y escuchar con una voz natural.
    </div>
  </div>

  <audio id="audioPlayer" style="display:none;"></audio>

  <script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");
    const micText = document.getElementById("micText");
    const voiceSelect = document.getElementById("voiceSelect");
    const audioPlayer = document.getElementById("audioPlayer");

    let recognition = null;
    let micOn = false;

    function addMessage(text, type) {
      const bubble = document.createElement("div");
      bubble.className = `bubble ${type}`;
      bubble.textContent = text;
      chatBox.appendChild(bubble);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function getSelectedVoice() {
      return voiceSelect.value || "femenino";
    }

    function getSelectedVoiceType() {
      return getSelectedVoice() === "masculino" ? "masculino" : "femenino";
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, "user");
      userInput.value = "";

      const loading = document.createElement("div");
      loading.className = "bubble assistant";
      loading.textContent = "Pensando...";
      chatBox.appendChild(loading);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const payload = {
          mensaje: text,
          faceta: "cuidador",
          audio: true,
          voz_tipo: getSelectedVoiceType(),
          producto: "asistente_senior",
          usuario: "usuario_app"
        };

        const response = await fetch("https://leo-maestro-7q4s.onrender.com/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        const finalText =
          data.respuesta ||
          data.response ||
          data.message ||
          "No recibí respuesta del asistente.";

        loading.textContent = finalText;

        if (data.audio_base64) {
          const mime = data.audio_mime || "audio/mpeg";
          const bytes = Uint8Array.from(atob(data.audio_base64), c => c.charCodeAt(0));
          const blob = new Blob([bytes], { type: mime });
          const url = URL.createObjectURL(blob);
          audioPlayer.src = url;
          audioPlayer.play().catch(() => {});
        } else if (data.audio_url) {
          audioPlayer.src = data.audio_url;
          audioPlayer.play().catch(() => {});
        }

      } catch (error) {
        loading.textContent = "No pude conectar con el asistente. Inténtalo de nuevo en unos segundos.";
      }
    }

    sendBtn.addEventListener("click", sendMessage);

    userInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    micBtn.addEventListener("click", () => {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        alert("Tu navegador no admite reconocimiento de voz. Puedes escribir con el teclado.");
        return;
      }

      if (!recognition) {
        recognition = new SpeechRecognition();
        recognition.lang = "es-ES";
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          userInput.value = transcript;
          setTimeout(() => {
            sendMessage();
          }, 300);
        };

        recognition.onerror = () => {
          micOn = false;
          micBtn.style.background = "linear-gradient(135deg, #d4af37, #aa7c11)";
          micText.textContent = "Hablar";
        };

        recognition.onend = () => {
          micOn = false;
          micBtn.style.background = "linear-gradient(135deg, #d4af37, #aa7c11)";
          micText.textContent = "Hablar";
        };
      }

      if (!micOn) {
        recognition.start();
        micOn = true;
        micBtn.style.background = "linear-gradient(135deg, #ff4d4d, #b91c1c)";
        micText.textContent = "Escuchando...";
      } else {
        recognition.stop();
        micOn = false;
      }
    });
  </script>
</body>
</html>
