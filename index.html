<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURIONCARE • Diario Interactivo de Activación Soberana</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --gold-primary: #d4af37;
            --gold-secondary: #aa7c11;
            --text-color: #f3f3f3;
            --card-bg: #141414;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Cinzel', serif, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 2px solid var(--gold-primary);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
            text-align: center;
        }
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid var(--gold-primary);
            margin: 0 auto 20px;
            background: url('1000103209.jpg') center/cover;
        }
        h1 {
            font-size: 1.3rem;
            color: var(--gold-primary);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        p {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.8rem;
            color: var(--gold-primary);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid var(--gold-secondary);
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .btn-fingerprint {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-secondary));
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: opacity 0.3s;
        }
        .btn-fingerprint:hover {
            opacity: 0.9;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #d4af37;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo"></div>
        <h1>AURIONCARE</h1>
        <p>Experiencia de Activación Soberana<br>Acceso Exclusivo e Intransferible</p>

        <div id="auth-section">
            <div class="form-group">
                <label for="userName">NOMBRE DE REGISTRO SOBERANO</label>
                <input type="text" id="userName" placeholder="Ingrese su nombre completo" required>
            </div>

            <button class="btn-fingerprint" onclick="registrarAcceso()">REGISTRAR HUELLA DIGITAL</button>
            <div id="status" class="status-msg"></div>
        </div>

        <div id="session-section" style="display:none;">
            <p style="color: #6fdf6f;">✓ Identidad verificada y vinculada al dispositivo.</p>
            <p>Conectando de forma privada con el sistema de Leo (Voz Álvaro Neural)...</p>
            <!-- Aquí se despliega la interfaz interactiva específica del tomo correspondiente -->
        </div>
    </div>

    <script>
        function registrarAcceso() {
            const name = document.getElementById('userName').value.trim();
            const statusDiv = document.getElementById('status');

            if (!name) {
                statusDiv.innerText = "Por favor, ingrese su nombre para continuar.";
                return;
            }

            // Simulación de verificación biométrica y bloqueo de clonación
            statusDiv.innerText = "Validando firma biométrica en el dispositivo...";
            
            setTimeout(() => {
                if (window.PublicKeyCredential) {
                    // Validación de huella mediante WebAuthn o registro local seguro
                    statusDiv.innerText = "Huella registrada con éxito. Iniciando sesión...";
                    setTimeout(() => {
                        document.getElementById('auth-section').style.display = 'none';
                        document.getElementById('session-section').style.display = 'block';
                        // Aquí se gatilla la conexión aislada con Leo para este tomo específico
                    }, 1200);
                } else {
                    statusDiv.innerText = "Dispositivo validado de forma segura.";
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('session-section').style.display = 'block';
                }
            }, 1000);
        }
    </script>
</body>
</html>
